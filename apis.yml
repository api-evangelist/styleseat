name: Styleseat
description: >-
  StyleSeat is an online booking and business-management marketplace for beauty
  and grooming professionals — hair stylists, barbers, nail technicians,
  estheticians, and other independent service providers. Professionals use
  StyleSeat to publish a bookable profile, manage their calendar and
  appointments, accept online payments and deposits, reduce no-shows, and market
  their services, while clients discover local pros, browse portfolios and
  reviews, and book appointments online. Founded in 2011 and based in San
  Francisco, StyleSeat operates as a consumer-facing web and mobile platform. It
  currently exposes no public developer API or partner API program; this profile
  was surfaced as a venture-portfolio company and enriched by the API Evangelist
  pipeline with domain-security and public-property signals.
